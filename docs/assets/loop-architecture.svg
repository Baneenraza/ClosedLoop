<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture: Android app calls the Node server over HTTP, which routes to Groq for text and Gemini for image and video, and serves the web UI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#539091"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#F4EEE2"/>

  <text x="60" y="34" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8A8275">android app — webview shell</text>
  <text x="500" y="34" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8A8275">node server</text>
  <text x="900" y="34" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8A8275">llm checks</text>

  <line x1="460" y1="10" x2="460" y2="580" stroke="#1C1B19" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="860" y1="10" x2="860" y2="580" stroke="#1C1B19" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- node 1: MainActivity -->
  <rect x="60" y="70" width="340" height="70" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"/>
  <rect x="60" y="70" width="4" height="70" fill="#539091"/>
  <circle cx="60" cy="70" r="14" fill="#539091"/>
  <text x="60" y="75" font-family="'Courier New', Courier, monospace" font-size="14" fill="#F4EEE2" text-anchor="middle">1</text>
  <text x="80" y="98" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1C1B19">MainActivity</text>
  <text x="80" y="118" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#8A8275">launcher</text>

  <!-- node 2: CheckActivity -->
  <rect x="60" y="160" width="340" height="70" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"/>
  <rect x="60" y="160" width="4" height="70" fill="#539091"/>
  <circle cx="60" cy="160" r="14" fill="#539091"/>
  <text x="60" y="165" font-family="'Courier New', Courier, monospace" font-size="14" fill="#F4EEE2" text-anchor="middle">2</text>
  <text x="80" y="188" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1C1B19">CheckActivity</text>
  <text x="80" y="208" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#8A8275">link / share intake, WebView</text>

  <!-- node 3: BubbleService -->
  <rect x="60" y="250" width="340" height="70" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"/>
  <rect x="60" y="250" width="4" height="70" fill="#539091"/>
  <circle cx="60" cy="250" r="14" fill="#539091"/>
  <text x="60" y="255" font-family="'Courier New', Courier, monospace" font-size="14" fill="#F4EEE2" text-anchor="middle">3</text>
  <text x="80" y="278" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1C1B19">BubbleService</text>
  <text x="80" y="298" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#8A8275">floating shield overlay</text>

  <!-- node 4: server.js -->
  <rect x="500" y="160" width="340" height="110" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"/>
  <rect x="500" y="160" width="4" height="110" fill="#539091"/>
  <circle cx="500" cy="160" r="14" fill="#539091"/>
  <text x="500" y="165" font-family="'Courier New', Courier, monospace" font-size="14" fill="#F4EEE2" text-anchor="middle">4</text>
  <text x="520" y="188" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1C1B19">server.js</text>
  <text x="520" y="210" font-family="'Courier New', Courier, monospace" font-size="12" fill="#8A8275">/api/check</text>
  <text x="520" y="228" font-family="'Courier New', Courier, monospace" font-size="12" fill="#8A8275">/api/check-image</text>
  <text x="520" y="246" font-family="'Courier New', Courier, monospace" font-size="12" fill="#8A8275">/api/check-video</text>

  <!-- node 7: public/index.html -->
  <rect x="500" y="420" width="340" height="70" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"/>
  <rect x="500" y="420" width="4" height="70" fill="#539091"/>
  <circle cx="500" cy="420" r="14" fill="#539091"/>
  <text x="500" y="425" font-family="'Courier New', Courier, monospace" font-size="14" fill="#F4EEE2" text-anchor="middle">7</text>
  <text x="520" y="448" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1C1B19">public/index.html</text>
  <text x="520" y="468" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#8A8275">the UI, in the WebView or a browser</text>

  <!-- node 5: Groq -->
  <rect x="900" y="70" width="240" height="70" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"/>
  <rect x="900" y="70" width="4" height="70" fill="#539091"/>
  <circle cx="900" cy="70" r="14" fill="#539091"/>
  <text x="900" y="75" font-family="'Courier New', Courier, monospace" font-size="14" fill="#F4EEE2" text-anchor="middle">5</text>
  <text x="920" y="98" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1C1B19">Groq</text>
  <text x="920" y="118" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#8A8275">text checks</text>

  <!-- node 6: Gemini -->
  <rect x="900" y="250" width="240" height="70" fill="#FFFFFF" stroke="#1C1B19" stroke-width="1"/>
  <rect x="900" y="250" width="4" height="70" fill="#539091"/>
  <circle cx="900" cy="250" r="14" fill="#539091"/>
  <text x="900" y="255" font-family="'Courier New', Courier, monospace" font-size="14" fill="#F4EEE2" text-anchor="middle">6</text>
  <text x="920" y="278" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1C1B19">Gemini</text>
  <text x="920" y="298" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#8A8275">image / video checks</text>

  <!-- arrows -->
  <path d="M400,195 L500,215" fill="none" stroke="#539091" stroke-width="2.5" marker-end="url(#arch-arrow)"/>
  <text x="410" y="212" font-family="'Courier New', Courier, monospace" font-size="11" fill="#8A8275">http</text>

  <path d="M840,190 L900,105" fill="none" stroke="#539091" stroke-width="2.5" marker-end="url(#arch-arrow)"/>
  <text x="700" y="135" font-family="'Courier New', Courier, monospace" font-size="11" fill="#8A8275">text</text>

  <path d="M840,240 L900,285" fill="none" stroke="#539091" stroke-width="2.5" marker-end="url(#arch-arrow)"/>
  <text x="945" y="243" font-family="'Courier New', Courier, monospace" font-size="11" fill="#8A8275">image / video</text>

  <path d="M670,270 L670,420" fill="none" stroke="#539091" stroke-width="2.5" marker-end="url(#arch-arrow)"/>
  <text x="678" y="350" font-family="'Courier New', Courier, monospace" font-size="11" fill="#8A8275">serves</text>

  <!-- fail-safe note -->
  <text x="60" y="560" font-family="'Courier New', Courier, monospace" font-style="italic" font-size="13" fill="#8A8275">no api key → server still runs, returns a cautious "yellow" verdict instead of failing.</text>
</svg>
