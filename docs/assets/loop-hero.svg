  <rect x="14" y="14" width="1172" height="352" fill="none" stroke="#1C1B19" stroke-opacity="0.18" stroke-width="1"/>
  <rect x="24" y="24" width="1152" height="332" fill="none" stroke="#1C1B19" stroke-opacity="0.08" stroke-width="1"/>

