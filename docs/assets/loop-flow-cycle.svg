<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The loop: identify, verify, flag, closing back to protecting the next person" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#539091"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#F4EEE2"/>

  <path d="M355,120 C500,20 700,20 845,120" fill="none" stroke="#539091" stroke-width="3" marker-end="url(#cycle-arrow)"/>
  <path d="M930,195 C1005,320 850,400 655,415" fill="none" stroke="#539091" stroke-width="3" marker-end="url(#cycle-arrow)"/>
  <path d="M550,415 C350,450 100,400 60,300 C40,220 70,190 260,188" fill="none" stroke="#539091" stroke-width="3" marker-end="url(#cycle-arrow)"/>

  <text x="600" y="255" font-family="'Courier New', Courier, monospace" font-style="italic" font-size="14" fill="#8A8275" text-anchor="middle">the loop closes — one report protects the next person</text>

  <!-- node 1: identify -->
  <circle cx="300" cy="150" r="55" fill="#F4EEE2" stroke="#539091" stroke-width="3"/>
  <text x="300" y="163" font-family="'Courier New', Courier, monospace" font-size="30" fill="#1C1B19" text-anchor="middle">1</text>
  <text x="300" y="235" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#1C1B19" text-anchor="middle">identify</text>
  <text font-family="'Courier New', Courier, monospace" font-size="13" fill="#8A8275">
    <tspan x="130" y="260">paste a message, link, or</tspan>
    <tspan x="130" y="278">screenshot. get a spoken verdict</tspan>
    <tspan x="130" y="296">in your language — red, yellow,</tspan>
    <tspan x="130" y="314">or green, plus one reason.</tspan>
  </text>

  <!-- node 2: verify -->
  <circle cx="900" cy="150" r="55" fill="#F4EEE2" stroke="#539091" stroke-width="3"/>
  <text x="900" y="163" font-family="'Courier New', Courier, monospace" font-size="30" fill="#1C1B19" text-anchor="middle">2</text>
  <text x="900" y="235" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#1C1B19" text-anchor="middle">verify</text>
  <text font-family="'Courier New', Courier, monospace" font-size="13" fill="#8A8275">
    <tspan x="870" y="260">no detector beats a perfect</tspan>
    <tspan x="870" y="278">deepfake clone. hang up. call</tspan>
    <tspan x="870" y="296">back on the real number. use a</tspan>
    <tspan x="870" y="314">family code word.</tspan>
  </text>

  <!-- node 3: flag -->
  <circle cx="600" cy="460" r="55" fill="#F4EEE2" stroke="#539091" stroke-width="3"/>
  <text x="600" y="473" font-family="'Courier New', Courier, monospace" font-size="30" fill="#1C1B19" text-anchor="middle">3</text>
  <text x="600" y="545" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#1C1B19" text-anchor="middle">flag</text>
  <text font-family="'Courier New', Courier, monospace" font-size="13" fill="#8A8275">
    <tspan x="430" y="570">after a red verdict, warn family</tspan>
    <tspan x="430" y="588">or mohalla in one tap — the next</tspan>
    <tspan x="430" y="606">person is protected.</tspan>
  </text>
</svg>
